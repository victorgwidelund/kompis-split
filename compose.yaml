services:
  paddleocr-model:
    image: alpine:3.23.3
    container_name: kompis-split-paddleocr-model
    restart: "no"
    volumes:
      - /mnt/user/kompis_split/paddleocr:/models
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache ca-certificates wget
        base="https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d"
        download() {
          file="$$1"
          checksum="$$2"
          if [ ! -s "/models/$$file" ] || ! echo "$$checksum  /models/$$file" | sha256sum -c -; then
            wget -O "/models/$$file.part" "$$base/$$file"
            echo "$$checksum  /models/$$file.part" | sha256sum -c -
            mv "/models/$$file.part" "/models/$$file"
          fi
        }
        download PaddleOCR-VL-1.6-GGUF.gguf f3ae46ec885050acf4b3d31944431e1fd90d50664fb09126af4a3c050ba14ee8
        download PaddleOCR-VL-1.6-GGUF-mmproj.gguf 204d757d7610d9b3faab10d506d69e5b244e32bf765e2bab2d0167e65e0a058a
    security_opt:
      - no-new-privileges:true

  paddleocr:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b9570
    container_name: kompis-split-paddleocr
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      paddleocr-model:
        condition: service_completed_successfully
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /mnt/user/kompis_split/paddleocr:/models:ro
    command:
      - --model
      - /models/PaddleOCR-VL-1.6-GGUF.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --temp
      - "0"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "99"
      - --parallel
      - "${PADDLEOCR_PARALLEL:-2}"
      - --cont-batching
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.10-alpine3.22
    container_name: kompis-split-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kompis_split
      POSTGRES_USER: kompis_split
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
    volumes:
      - /mnt/user/kompis_split/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompis_split -d kompis_split"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  kompis-split:
    image: ghcr.io/victorgwidelund/kompis-split:latest
    container_name: kompis-split
    restart: unless-stopped
    pull_policy: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kompis_split
      PGUSER: kompis_split
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in Compose Manager}"
      COOKIE_SECRET: "${COOKIE_SECRET:?Set COOKIE_SECRET in Compose Manager}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      PADDLEOCR_URL: http://paddleocr:8080
      PADDLEOCR_MODEL: PaddleOCR-VL-1.6
      PADDLEOCR_TIMEOUT_MS: "${PADDLEOCR_TIMEOUT_MS:-60000}"
      PADDLEOCR_MAX_TOKENS: "${PADDLEOCR_MAX_TOKENS:-512}"
      PADDLEOCR_ACCURATE_RETRY: "${PADDLEOCR_ACCURATE_RETRY:-true}"
      RECEIPT_OCR_WORKERS: "${RECEIPT_OCR_WORKERS:-2}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    labels:
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8787]/"

  postgres-backup:
    image: postgres:17.10-alpine3.22
    container_name: kompis-split-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kompis_split
      PGUSER: kompis_split
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - /mnt/user/kompis_split/backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          target="/backups/kompis-split-$$(date -u +%F-%H%M%S).dump"
          pg_dump --format=custom --file="$$target"
          find /backups -type f -name 'kompis-split-*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true
