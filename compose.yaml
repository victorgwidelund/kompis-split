services:
  receipt-inference:
    image: ghcr.io/victorgwidelund/kompis-split-receipt-inference:latest
    container_name: kompis-split-receipt-inference
    restart: unless-stopped
    pull_policy: missing
    environment:
      OCR_INTRA_OP_THREADS: "${OCR_INTRA_OP_THREADS:-8}"
      OCR_QUEUE_CAPACITY: "${OCR_QUEUE_CAPACITY:-4}"
      ORT_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "${OCR_INTRA_OP_THREADS:-8}"
      OPENBLAS_NUM_THREADS: "${OCR_INTRA_OP_THREADS:-8}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 20s
    networks:
      - receipt-private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "${OCR_MEMORY_LIMIT:-1g}"
    cpus: "${OCR_CPU_LIMIT:-8}"
    stop_grace_period: 20s

  postgres:
    image: postgres:17.10-alpine3.22
    container_name: kompis-split-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kompis_split
      POSTGRES_USER: kompis_split
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
    volumes:
      - /mnt/user/kompis_split/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kompis_split -d kompis_split"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  kompis-split:
    image: ghcr.io/victorgwidelund/kompis-split:latest
    container_name: kompis-split
    restart: unless-stopped
    pull_policy: missing
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      receipt-inference:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kompis_split
      PGUSER: kompis_split
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in Compose Manager}"
      COOKIE_SECRET: "${COOKIE_SECRET:?Set COOKIE_SECRET in Compose Manager}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      RECEIPT_INFERENCE_URL: http://receipt-inference:8080
      RECEIPT_INFERENCE_ALLOWED_HOSTS: receipt-inference
      RECEIPT_INFERENCE_TIMEOUT_MS: "${RECEIPT_INFERENCE_TIMEOUT_MS:-15000}"
      RECEIPT_NORMALIZED_FALLBACK: "false"
      RECEIPT_OCR_WORKERS: "${RECEIPT_OCR_WORKERS:-1}"
    networks:
      - default
      - receipt-private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    labels:
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8787]/"

  postgres-backup:
    image: postgres:17.10-alpine3.22
    container_name: kompis-split-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kompis_split
      PGUSER: kompis_split
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Compose Manager}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - /mnt/user/kompis_split/backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          target="/backups/kompis-split-$$(date -u +%F-%H%M%S).dump"
          pg_dump --format=custom --file="$$target"
          find /backups -type f -name 'kompis-split-*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true

networks:
  receipt-private:
    internal: true
