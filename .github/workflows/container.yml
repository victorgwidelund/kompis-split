name: Test and publish container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.22
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - name: Build application container
        run: docker build --build-arg APP_VERSION=1.25.0 -t kompis-split:test .
      - name: Build receipt inference container
        run: docker build -f receipt-inference/Dockerfile -t kompis-split-receipt-inference:test .
      - name: Smoke-test receipt inference without Internet access
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs receipt-inference-test || true
            fi
            docker rm --force receipt-inference-test >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker run --detach --name receipt-inference-test --network none kompis-split-receipt-inference:test
          docker cp tests/ocr-benchmark/corpus/dev/grocery_clean_dev1.jpg receipt-inference-test:/tmp/receipt.jpg
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec receipt-inference-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"; then
              ready=true
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' receipt-inference-test)" = true ]
            sleep 1
          done
          [ "$ready" = true ]
          docker exec receipt-inference-test python -c "import pathlib,urllib.request,json; data=pathlib.Path('/tmp/receipt.jpg').read_bytes(); request=urllib.request.Request('http://127.0.0.1:8080/v1/ocr',data=data,headers={'Content-Type':'application/octet-stream'}); result=json.load(urllib.request.urlopen(request,timeout=20)); assert result['engine'].startswith('rapidocr-3.9.2/'); assert len(result['lines']) > 0"
      - name: Validate Docker Compose
        env:
          APP_PASSWORD: compose-validation-password
          COOKIE_SECRET: compose-validation-cookie-secret-32-bytes
          POSTGRES_PASSWORD: compose-validation-database-password
        run: docker compose config --quiet

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release version
        id: release
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version%.0}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kompis-split
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/metadata-action@v5
        id: inference-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kompis-split-receipt-inference
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: receipt-inference/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.inference-meta.outputs.tags }}
          labels: ${{ steps.inference-meta.outputs.labels }}
          cache-from: type=gha,scope=receipt-inference
          cache-to: type=gha,mode=max,scope=receipt-inference
